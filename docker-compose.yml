version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nivaas_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nivaas}
      POSTGRES_USER: ${POSTGRES_USER:-nivaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - nivaas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nivaas} -d $${POSTGRES_DB:-nivaas}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  nivaas_pgdata:
